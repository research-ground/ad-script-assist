# AD Script Assist Unified Configuration (models.conf)
#
# Single configuration file read on the Node.js server (src/server.ts).
# Secret API keys under [keys] are never sent to the browser: GET /api/config
# replaces non-empty keys with __SERVER_KEY:<name>__ placeholders, and
# POST /api/proxy substitutes real keys in server memory.
#
# Local key hygiene: keep personal API keys out of git commits by marking this
# file skip-worktree locally:
#   git update-index --skip-worktree models.conf

[providers]
# Active AI Vision / Q&A provider: gemini | openai
ai_provider = gemini

# Default Text-to-Speech engine: kokoro (local neural TTS) | gemini | openai
tts_provider = kokoro

# Cloud Text-to-Speech provider when switching to Cloud TTS in the UI: gemini | openai
cloud_tts_provider = gemini

[models]
gemini_model = gemini-3.5-flash-lite
openai_model = gpt-4o
gemini_tts_model = gemini-3.1-flash-tts-preview
openai_tts_model = tts-1

[keys]
gemini_api_key =
openai_api_key =
